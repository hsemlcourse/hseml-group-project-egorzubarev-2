services:
  notebook:
    build: .
    image: laptop-cp2:latest
    container_name: laptop-cp2-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      JUPYTER_TOKEN: ""
      PYTHONIOENCODING: utf-8
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=
      - --ServerApp.password=
